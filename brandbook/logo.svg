  <line x1="128" y1="70" x2="165" y2="70" stroke="#393C41" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="128" y1="70" x2="152" y2="88" stroke="#5C5E62" stroke-width="3.5" stroke-linecap="round"/>
  
  <circle cx="156" cy="50" r="5.5" fill="#171A20"/>
  <circle cx="170" cy="70" r="5.5" fill="#393C41"/>
  <circle cx="156" cy="90" r="5.5" fill="#5C5E62"/>
